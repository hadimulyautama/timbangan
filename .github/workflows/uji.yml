name: uji
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  regresi:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: uji
          POSTGRES_DB: uji_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      UJI_PG_URL: postgresql+asyncpg://postgres:uji@127.0.0.1:5432/uji_ci
      DATABASE_URL: postgresql+asyncpg://postgres:uji@127.0.0.1:5432/uji_ci
    steps:
      - uses: actions/checkout@v4
        with:
          path: timbangan
      - uses: actions/checkout@v4
        with:
          repository: hadimulyautama/penggilingan-beras
          ref: 00bdbbed79efb4d86db2070f5ba07fdb165a2194
          path: produksi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            timbangan/requirements*.txt
            produksi/requirements*.txt
      - name: Pasang interpreter terpisah
        run: |
          python -m venv produksi/.venv
          produksi/.venv/bin/pip install -r produksi/requirements.txt
          python -m pip install -r timbangan/requirements.txt -r timbangan/requirements-dev.txt
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Bangun skema kedua rantai tanpa melompati migrasi
        run: |
          (cd produksi && .venv/bin/python -m alembic upgrade 0063_sebab_selisih_timbang)
          (cd timbangan && python -m alembic stamp 0026_timbangan_hapus_pengawas)
          (cd timbangan && python -m alembic upgrade 0038_kunci_baris_64)
          (cd produksi && .venv/bin/python -m alembic upgrade head)
          (cd timbangan && python -m alembic upgrade head)
      - name: Periksa model dan migrasi
        working-directory: timbangan
        run: python -m alembic check
      - name: Regresi layanan dan HTTP
        working-directory: timbangan
        run: |
          python - <<'PYTHON'
          import subprocess,sys
          from pathlib import Path
          # Browser dan PWA memerlukan profil tersendiri; bukan dilewati diam-diam.
          files=[str(p) for p in sorted(Path('tests/timbangan').glob('test_*.py')) if not p.name.endswith('_browser.py')]
          subprocess.run([sys.executable,'-m','pytest','-q',*files,'--junitxml=../bukti/layanan.xml'],check=True)
          PYTHON
      - name: Regresi PostgreSQL dan paket identitas
        working-directory: timbangan
        run: python -m pytest -q tests/pg tests/test_identitas_paket.py --junitxml=../bukti/postgres.xml
      - name: Browser detail retur dan regresi pengiriman
        working-directory: timbangan
        run: >-
          python -m pytest -q tests/timbangan/test_rincian_retur_browser.py
          tests/timbangan/test_rincian_keluar_browser.py -k 'not webkit'
          --junitxml=../bukti/browser.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regresi-teraflow83
          path: bukti/
