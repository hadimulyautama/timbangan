name: uji
on:
  workflow_dispatch:
    inputs:
      padiflow_ref:
        description: Revisi PadiFlow pasangan yang diuji
        type: string
        required: true
        default: 946bc0f3c7875cc763ac632f83613bbcc7c98d40
jobs:
  regresi:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [layanan, postgres, browser]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: uji
          POSTGRES_DB: uji_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      UJI_PG_URL: postgresql+asyncpg://postgres:uji@127.0.0.1:5432/uji_ci
      DATABASE_URL: postgresql+asyncpg://postgres:uji@127.0.0.1:5432/uji_ci
    steps:
      - uses: actions/checkout@v4
        with:
          path: timbangan
      - uses: actions/checkout@v4
        with:
          repository: hadimulyautama/penggilingan-beras
          ref: ${{ inputs.padiflow_ref }}
          path: produksi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            timbangan/requirements*.txt
            produksi/requirements*.txt
      - name: Pasang interpreter terpisah
        run: |
          python -m pip install -r timbangan/requirements.txt -r timbangan/requirements-dev.txt
          # Suite layanan juga menjalankan uji responsif tara kemasan;
          # paket Playwright dipasang pada semua job untuk koleksi tes.
          python -m pip install playwright==1.62.0
      - name: Pasang interpreter migrasi PadiFlow
        if: matrix.suite == 'postgres'
        run: |
          python -m venv produksi/.venv
          produksi/.venv/bin/pip install -r produksi/requirements.txt
      - name: Pasang Chromium
        if: matrix.suite == 'browser' || matrix.suite == 'layanan'
        run: python -m playwright install --with-deps chromium
      - name: Bangun skema kedua rantai tanpa melompati migrasi
        if: matrix.suite == 'postgres'
        run: |
          (cd produksi && .venv/bin/python -m alembic upgrade 0063_sebab_selisih_timbang)
          (cd timbangan && python -m alembic stamp 0026_timbangan_hapus_pengawas)
          (cd timbangan && python -m alembic upgrade 0038_kunci_baris_64)
          (cd produksi && .venv/bin/python -m alembic upgrade head)
          (cd timbangan && python -m alembic upgrade head)
      - name: Periksa model dan migrasi
        if: matrix.suite == 'postgres'
        working-directory: timbangan
        run: python -m tests.periksa_skema_bersama
      - name: Regresi layanan dan HTTP
        if: matrix.suite == 'layanan'
        working-directory: timbangan
        run: |
          python - <<'PYTHON'
          import subprocess,sys
          from pathlib import Path
          # Browser dan PWA memerlukan profil tersendiri; bukan dilewati diam-diam.
          files=[str(p) for p in sorted(Path('tests/timbangan').glob('test_*.py')) if not p.name.endswith('_browser.py')]
          subprocess.run([sys.executable,'-m','pytest','-q',*files,'--junitxml=../bukti/layanan.xml'],check=True)
          PYTHON
      - name: Regresi PostgreSQL dan paket identitas
        if: matrix.suite == 'postgres'
        working-directory: timbangan
        run: python -m pytest -q tests/pg tests/test_identitas_paket.py tests/test_ruang_data.py --junitxml=../bukti/postgres.xml
      - name: Browser detail retur dan regresi pengiriman
        if: matrix.suite == 'browser'
        working-directory: timbangan
        run: >-
          python -m pytest -q tests/timbangan/test_rincian_retur_browser.py
          tests/timbangan/test_rincian_keluar_browser.py -k 'not webkit'
          --junitxml=../bukti/browser.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regresi-teraflow83-${{ matrix.suite }}
          path: bukti/

  safari:
    name: Operator Safari/iPhone (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [webkit, chromium]
    env:
      UJI_BROWSER: ${{ matrix.browser }}
      UJI_IPHONE: "1"
      UJI_PDF_OUT: ../bukti/pdf
      UJI_TRANSFER_OUT: ../bukti/transfer
      UJI_CETAK_OUT: ../bukti/cetak
    steps:
      - uses: actions/checkout@v4
        with:
          path: timbangan
      - uses: actions/checkout@v4
        with:
          repository: hadimulyautama/penggilingan-beras
          ref: ${{ inputs.padiflow_ref }}
          path: produksi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: timbangan/requirements*.txt
      - name: Pasang dependensi dan mesin browser yang diminta
        run: |
          python -m pip install -r timbangan/requirements.txt -r timbangan/requirements-dev.txt playwright==1.62.0
          python -m playwright install --with-deps "${{ matrix.browser }}"
      - name: Timbang, transfer, pengiriman, PDF dan printer tanpa data produksi
        working-directory: timbangan
        run: |
          if [ "$UJI_BROWSER" = webkit ]; then lawan=chromium; else lawan=webkit; fi
          python -m pytest -q tests/timbangan/test_timbang_pertama_desain_browser.py \
            tests/timbangan/test_timbang_kedua_desain_browser.py \
            tests/timbangan/test_rincian_transfer_browser.py \
            tests/timbangan/test_rincian_keluar_browser.py \
            tests/timbangan/test_rincian_retur_browser.py \
            tests/timbangan/test_curah_browser.py \
            tests/timbangan/test_cetak_pratinjau_browser.py \
            tests/timbangan/test_pdf_dialog_dan_sambungan_browser.py \
            tests/timbangan/test_printer_pulih_browser.py \
            -k "not $lawan" --junitxml=../bukti/safari.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safari-teraflow-${{ matrix.browser }}
          path: bukti/
